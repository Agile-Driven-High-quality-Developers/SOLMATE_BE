name: CI/CD

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      # 2. Java 21 세팅
      - name: Java 21 세팅
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Gradle 빌드 + 테스트
      - name: Gradle 빌드
        run: ./gradlew build -x test

      # 4. Docker Hub 로그인
      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Docker 이미지 빌드 + push
      - name: Docker 이미지 빌드 및 push
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/solmate-be:${{ github.sha }} .
          docker push ${{ secrets.DOCKER_USERNAME }}/solmate-be:${{ github.sha }}

      # 6. EC2에 SSH 접속 준비
      - name: SSH 키 세팅
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      # 7. application.yml EC2로 전송
      - name: application.yml 전송
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "mkdir -p /home/ubuntu/app"
          echo "${{ secrets.APPLICATION_YML }}" | \
            ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "cat > /home/ubuntu/app/application.yml"

      # 8. docker-compose.yml, deploy.sh EC2로 전송
      - name: 배포 파일 전송
        run: |
          scp -i ~/.ssh/ec2_key docker-compose.yml \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/docker-compose.yml
          scp -i ~/.ssh/ec2_key deploy.sh \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/home/ubuntu/app/deploy.sh

      # 9. deploy.sh 실행
      - name: 배포 실행
        run: |
          ssh -i ~/.ssh/ec2_key ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} \
            "chmod +x /home/ubuntu/app/deploy.sh && \
             cd /home/ubuntu/app && \
             DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }} \
             IMAGE_TAG=${{ github.sha }} \
             bash deploy.sh ${{ secrets.DOCKER_USERNAME }} ${{ github.sha }}"